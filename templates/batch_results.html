<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batch Results | PhishGuard</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="/">PhishGuard</a><a href="/">New scan</a></header><main class="result-layout"><section class="panel"><p class="eyebrow">Batch complete</p><h1>{{ results|length }} URLs analyzed</h1><div class="table-wrap"><table><thead><tr><th>URL</th><th>Classification</th><th>Risk</th><th>Score</th></tr></thead><tbody>{% for item in results %}<tr><td>{{ item.url }}</td><td>{{ item.prediction|capitalize }}</td><td>{{ item.risk_level|default('invalid')|capitalize }}</td><td>{{ item.risk_score }}</td></tr>{% endfor %}</tbody></table></div></section></main></body></html>
