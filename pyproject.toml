[project]
name = "phishguard"
version = "1.0.0"
description = "Explainable phishing URL risk analysis with Flask and scikit-learn"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "gunicorn>=22,<24",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
